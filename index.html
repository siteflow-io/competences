<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compétences transversales</title>
<style>
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif;color:#1f2a36;background:#f3f5f8;display:flex;justify-content:center;align-items:flex-start;}
.cadre{width:100%;max-width:620px;padding:70px 20px;text-align:center;}
.rond{width:42px;height:42px;margin:0 auto 16px;border:5px solid #dfe6ee;border-top-color:#0070C0;border-radius:50%;animation:t .9s linear infinite;}
@keyframes t{to{transform:rotate(360deg);}}
.attente{color:#667085;}
.echec{background:#fff;border:1px solid #e3e8ef;border-left:5px solid #c0392b;border-radius:12px;padding:24px 22px;text-align:left;}
.echec h1{font-size:20px;margin:0 0 8px;color:#8e1b12;}
.echec p{margin:0 0 10px;}
.echec .detail{font-size:13px;color:#7a8594;word-break:break-word;}
.echec button{margin-top:8px;padding:10px 18px;border:1px solid #0070C0;border-radius:8px;background:#fff;color:#0070C0;font:600 15px "Segoe UI",system-ui,Arial,sans-serif;cursor:pointer;}
.echec button:hover{background:#eef6fc;}
</style>
</head>
<body>
<div class="cadre" id="cadre"><div class="rond"></div><p class="attente">Chargement…</p></div>
<script>
// Page d'entrée du lien de saisie. Elle affiche l'écran voulu (?p=saisie…) : exactement le fichier que l'ancien lien
// affichait, avec ses données de départ, demandés au script du tableau. Les demandes partent en texte simple et sans aucun
// cookie ni compte Google : Google les traite comme un visiteur sans compte, et le script s'exécute en tant que propriétaire
// du tableau. C'est ce qui permet au lien de s'ouvrir quel que soit le compte Google ouvert dans le navigateur.
// Vitesse : chaque écran est gardé dans la mémoire du navigateur et s'affiche aussitôt à la visite suivante (puis il est
// vérifié auprès de Google, sans rien bloquer) ; depuis l'accueil, la saisie est demandée d'avance, et les autres écrans
// dès que la souris passe sur leur tuile. Les valeurs des élèves, elles, sont toujours lues dans le tableau au moment voulu.
(function(){
  var LIEN_SCRIPT='https://script.google.com/macros/s/AKfycbwZmEVwnVjd1URCvz-2GZFlGnCOpGazM5sKmTQY589KPgruTLg7ZXgu4iM4WlpgMYsbtw/exec';
  var ATTENTE_PAGE=30000;     // un écran : 30 s au plus, sinon on le dit
  var ATTENTE_APPEL=420000;   // un appel : Google arrête lui-même un script au bout de 6 minutes
  var FRAIS=120000;           // un écran gardé depuis moins de 2 minutes s'affiche sans être redemandé
  var BASE=location.origin+location.pathname;
  var p='accueil';try{p=new URLSearchParams(location.search).get('p')||'accueil';}catch(e){}

  // Ce que ce navigateur gardait pour l'ancien lien (dernière saisie, valeurs pas encore envoyées…) arrive dans l'adresse :
  // on le range ici, sans écraser ce qui serait déjà rangé, puis on l'enlève de l'adresse.
  if(location.hash.indexOf('#ct=')===0){
    try{var m=JSON.parse(decodeURIComponent(location.hash.slice(4)));
      Object.keys(m).forEach(function(k){if(k.indexOf('ct_')===0&&typeof m[k]==='string'&&localStorage.getItem(k)===null)localStorage.setItem(k,m[k]);});}catch(e){}
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  }

  // Posé dans cette page et recopié dans chaque écran affiché :
  //  - google.script.run, google.script.host, google.script.url : même façon d'écrire, mêmes réponses, mêmes erreurs ;
  //  - la mémoire des écrans, dans le « Cache » du navigateur (à part du localStorage, que ce site partage avec d'autres pages) ;
  //  - le préchargement d'un écran ; l'envoi qui part encore quand la page se ferme.
  function poserGoogle(LIEN,ATTENTE,BASE,FRAIS){
    function appeler(corps,delai){return new Promise(function(ok,ko){
      var fini=false,ctrl=window.AbortController?new AbortController():null;
      var minuterie=setTimeout(function(){if(fini)return;fini=true;if(ctrl)ctrl.abort();ko(new Error('timed out : Google ne répond pas.'));},delai);
      fetch(LIEN,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(corps),credentials:'omit',redirect:'follow',cache:'no-store',signal:ctrl?ctrl.signal:undefined})
        .then(function(r){if(!r.ok)throw new Error('server error '+r.status+(r.status===429?' : too many requests':''));return r.text();})
        .then(function(t){if(fini)return;var d=null;try{d=JSON.parse(t);}catch(e){}
          fini=true;clearTimeout(minuterie);
          if(!d)ko(new Error('Google a répondu, mais pas avec les données attendues.'));else if(d.ok)ok(d);else ko(new Error(d.e||'Demande refusée.'));})
        .catch(function(e){if(fini)return;fini=true;clearTimeout(minuterie);ko(e&&e.name==='TypeError'?new Error('NetworkError : '+e.message):e);});
    });}
    function run(){var ok=null,ko=null,uo;var api=new Proxy({},{get:function(t,k){
      if(typeof k!=='string'||k==='then')return undefined;
      if(k==='withSuccessHandler')return function(f){ok=f;return api;};
      if(k==='withFailureHandler')return function(f){ko=f;return api;};
      if(k==='withUserObject')return function(o){uo=o;return api;};
      return function(){var a=Array.prototype.slice.call(arguments);
        appeler({f:k,a:a},ATTENTE).then(function(d){if(ok)ok(d.r,uo);},function(e){if(ko)ko(e,uo);else if(window.console)console.error(e);});};}});
      return api;}
    function lieu(){var q={},qs={};try{new URLSearchParams(location.search).forEach(function(v,k){if(!(k in q))q[k]=v;(qs[k]=qs[k]||[]).push(v);});}catch(e){}
      return {hash:location.hash.replace(/^#/,''),parameter:q,parameters:qs};}
    window.__appelerScript=appeler;
    window.google={script:{get run(){return run();},
      host:{close:function(){},setHeight:function(){},setWidth:function(){},editor:{focus:function(){}},origin:location.origin},
      url:{getLocation:function(cb){cb(lieu());}},
      history:{push:function(){},replace:function(){},setChangeHandler:function(){}}}};
    // La mémoire des écrans
    var NOM='ct-ecrans-v1';function cle(x){return BASE+'__ecran__/'+encodeURIComponent(x);}
    window.__ctLireEcran=function(x){try{if(!window.caches)return Promise.resolve(null);
      return caches.open(NOM).then(function(c){return c.match(cle(x));}).then(function(r){return r?r.json():null;}).catch(function(){return null;});}catch(e){return Promise.resolve(null);}};
    window.__ctGarderEcran=function(x,d){try{if(!window.caches)return Promise.resolve();
      return caches.open(NOM).then(function(c){return c.put(cle(x),new Response(JSON.stringify({t:Date.now(),html:d.html,depart:d.depart}),{headers:{'Content-Type':'application/json'}}));}).catch(function(){});}catch(e){return Promise.resolve();}};
    // Demander un écran d'avance (une seule fois à la fois ; rien si celui qu'on a date de moins de 2 minutes)
    var enVol=window.__ctEnVol=window.__ctEnVol||{};   // partagé entre cette page et l'écran écrit à sa place : jamais deux demandes du même écran
    window.__ctPrecharger=function(x){if(enVol[x])return enVol[x];
      enVol[x]=window.__ctLireEcran(x).then(function(m){if(m&&Date.now()-m.t<FRAIS)return m;
        return appeler({f:'page',p:x},30000).then(function(d){return window.__ctGarderEcran(x,d).then(function(){return {t:Date.now(),html:d.html,depart:d.depart};});});})
        .catch(function(){delete enVol[x];return null;});
      return enVol[x];};
    // Un envoi que le navigateur termine même si la page vient de se fermer
    window.__envoyerEnPartant=function(f,a){try{fetch(LIEN,{method:'POST',keepalive:true,credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({f:f,a:a})}).catch(function(){});}catch(e){}};
    // Le collègue a-t-il commencé à se servir de l'écran ? Alors on ne le remplace jamais sous ses yeux.
    window.__ctTouche=false;
    ['pointerdown','keydown'].forEach(function(t){window.addEventListener(t,function(){window.__ctTouche=true;},true);});
  }
  // Sur l'accueil : la saisie est demandée d'avance ; les autres écrans dès que la souris (ou le doigt) arrive sur leur tuile
  function prechargerDepuisAccueil(){
    function go(){setTimeout(function(){if(window.__ctPrecharger)window.__ctPrecharger('saisie');},150);
      document.querySelectorAll('.tuile[data-p]').forEach(function(a){var f=function(){if(window.__ctPrecharger)window.__ctPrecharger(a.dataset.p);};
        a.addEventListener('pointerenter',f);a.addEventListener('touchstart',f,{passive:true});a.addEventListener('focus',f);});}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
  }

  var cadre=document.getElementById('cadre');
  function echapper(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function attente(){cadre.innerHTML='<div class="rond"></div><p class="attente">Chargement…</p>';}
  function echec(e){
    var m=String(e&&e.message||e||'');
    var raison=!navigator.onLine?'La connexion internet est coupée.'
      :/timed out/.test(m)?'Google ne répond pas pour l\'instant.'
      :/NetworkError/.test(m)?'Cet ordinateur n\'arrive pas à joindre Google pour l\'instant.'
      :'Google n\'a pas pu ouvrir la page.';
    cadre.innerHTML='<div class="echec" role="alert"><h1>Impossible d\'ouvrir la page pour l\'instant</h1>'
      +'<p>'+raison+' Rien n\'a été effacé.</p>'
      +'<p class="detail">Message, à montrer au référent : « '+echapper(m.slice(0,300))+' »</p>'
      +'<button id="reessayer" title="Redemande la page à Google (quelques secondes). Rien n\'est écrit.">↻ Réessayer</button></div>';
    document.getElementById('reessayer').onclick=charger;
  }
  // L'écran est écrit à la place de cette page. Comme sur l'ancien lien : google.script.* existe dès le début,
  // MODE_WEB, URL_APPLI et DEMARRAGE sont posés à la fin de l'écran (l'ancien lien les ajoutait au même endroit).
  function ecrire(html,depart){
    var tete=(/name=["']viewport["']/i.test(html)?'':'<meta name="viewport" content="width=device-width, initial-scale=1">')
      +'<script>('+poserGoogle.toString()+')('+JSON.stringify(LIEN_SCRIPT)+','+ATTENTE_APPEL+','+JSON.stringify(BASE)+','+FRAIS+');<\/script>';
    var fin='<script>window.MODE_WEB=true;window.URL_APPLI='+JSON.stringify(BASE)+';window.DEMARRAGE='+JSON.stringify(depart).replace(/</g,'\\u003c')+';<\/script>'
      +(p==='accueil'?'<script>('+prechargerDepuisAccueil.toString()+')();<\/script>':'');
    var h=/<head(\s[^>]*)?>/i.exec(html);
    html=h?html.slice(0,h.index+h[0].length)+tete+html.slice(h.index+h[0].length):tete+html;
    document.open();document.write(html+fin);document.close();
    document.title='Compétences transversales';
  }
  // Ce qui compte pour savoir si l'écran gardé est encore le bon : son fichier, la liste des classes, les matières
  function empreinte(d){var x=d&&d.depart||{};return (d&&d.html||'')+'|'+JSON.stringify([x.config,x.onglets,x.tableau,x.lien]);}
  // L'écran gardé est affiché ; Google est interrogé en coulisse. S'il a changé et que le collègue n'a encore rien touché,
  // la page se recharge sur le nouvel écran (aussitôt, depuis la mémoire) ; sinon le nouveau servira à la visite suivante.
  function verifier(m){
    window.__appelerScript({f:'page',p:p},ATTENTE_PAGE).then(function(d){
      window.__ctGarderEcran(p,d).then(function(){if(empreinte(d)!==empreinte(m)&&!window.__ctTouche)location.reload();});
    },function(){});   // Google ne répond pas : l'écran affiché reste, ses propres appels diront ce qui se passe
  }
  var pose=false;
  function charger(){
    attente();
    if(!pose){pose=true;poserGoogle(LIEN_SCRIPT,ATTENTE_APPEL,BASE,FRAIS);}
    if(p==='accueil')window.__ctPrecharger('saisie');   // en même temps que l'accueil : prête avant le clic
    window.__ctLireEcran(p).then(function(m){
      if(m&&m.html){ecrire(m.html,m.depart);if(Date.now()-m.t>=FRAIS)verifier(m);return;}
      window.__appelerScript({f:'page',p:p},ATTENTE_PAGE).then(function(d){window.__ctGarderEcran(p,d);ecrire(d.html,d.depart);},echec);
    });
  }
  charger();
})();
</script>
</body>
</html>
